name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Qt has no display on a runner, and the suite constructs real widgets.
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the dev dependency group
        run: uv sync --only-group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned rather than ">=3.13", because bpy only publishes wheels for specific versions.
          python-version: "3.13"
          enable-cache: true

      - name: Install Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build the proto bindings
        run: >
          uv run python -m grpc_tools.protoc
          --proto_path=src/protos --python_out=src/protos
          src/protos/state.proto src/protos/cache.proto

      - name: Run the unit tests
        # The suite imports `main`, `utils_rr`, ... as top-level modules, and src/ is not a
        # package, so it has to be the working directory.
        working-directory: src
        run: uv run python -m unittest discover --start-directory . --pattern "*_test.py" --verbose
